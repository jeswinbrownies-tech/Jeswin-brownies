<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jeswin Sweets | Premium Brownies - Kumbakonam</title>

    <meta name="description"
          content="Jeswin Sweets - Fresh homemade brownies in Kumbakonam. Mini, Medium & Large sizes. Order via WhatsApp.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --primary: #8B4513;
            --primary-dark: #5D2E0A;
            --accent: #D2691E;
            --gold: #FFD700;
            --cream: #FFF8F0;
            --pink: #FF6B9D;
            --purple: #9B59B6;
            --green: #27AE60;
            --dark: #2C1810;
            --white: #FFFFFF;
            --shadow: 0 10px 40px rgba(139, 69, 19, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(
                135deg,
                #FFF8F0 0%,
                #FFE4C4 50%,
                #FFDAB9 100%
            );
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 248, 240, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(139, 69, 19, 0.1);
            z-index: 1000;
            padding: 12px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            background: linear-gradient(
                45deg,
                var(--primary),
                var(--accent)
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px;
            position: relative;

            background:
                radial-gradient(
                    circle at 20% 80%,
                    rgba(255, 107, 157, 0.15) 0%,
                    transparent 50%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(155, 89, 182, 0.15) 0%,
                    transparent 50%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(210, 105, 30, 0.1) 0%,
                    transparent 70%
                );
        }

        .hero-content {
            max-width: 900px;
            z-index: 2;
        }

        .hero-badge {
            display: inline-block;
            background: linear-gradient(
                135deg,
                var(--pink),
                var(--purple)
            );
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero h1 span {
            background: linear-gradient(
                45deg,
                var(--accent),
                var(--pink),
                var(--purple)
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: #5D4037;
            margin-bottom: 30px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary,
        .btn-secondary {
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--accent)
            );
            color: white;
            box-shadow: 0 6px 25px rgba(139, 69, 19, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.45);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        /* ================= FLOATING ================= */

        .floating-brownie {
            position: absolute;
            font-size: 3rem;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }

        .fb1 {
            top: 15%;
            left: 8%;
        }

        .fb2 {
            top: 25%;
            right: 10%;
            animation-delay: 1.5s;
            font-size: 2.5rem;
        }

        .fb3 {
            bottom: 20%;
            left: 12%;
            animation-delay: 3s;
            font-size: 2.8rem;
        }

        .fb4 {
            bottom: 30%;
            right: 8%;
            animation-delay: 4.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        /* ================= GENERAL ================= */

        section {
            padding: 80px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 2.8rem);
            color: var(--primary-dark);
            margin-bottom: 12px;
        }

        .section-title p {
            color: #6D4C41;
            font-size: 1.1rem;
            max-width: 600px;
            margin: auto;
        }

        .title-underline {
            width: 80px;
            height: 4px;
            background: linear-gradient(
                90deg,
                var(--pink),
                var(--accent),
                var(--purple)
            );
            margin: 16px auto 0;
            border-radius: 2px;
        }

        /* ================= ABOUT ================= */

        .about {
            background: white;
            border-radius: 40px 40px 0 0;
            margin-top: -40px;
            position: relative;
            z-index: 5;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.05);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-image {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .about-image img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }

        .about-image:hover img {
            transform: scale(1.05);
        }

        .about-content h3 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 16px;
            font-family: 'Playfair Display', serif;
        }

        .about-content p {
            color: #5D4037;
            margin-bottom: 16px;
            font-size: 1.05rem;
        }

        .owner-card {
            background: linear-gradient(
                135deg,
                #FFF5EE,
                #FFE4C4
            );
            padding: 20px;
            border-radius: 16px;
            border-left: 5px solid var(--accent);
            margin-top: 24px;
        }

        /* ================= MENU ================= */

        .brownie-menu {
            background: linear-gradient(
                180deg,
                white 0%,
                #FFF8F0 100%
            );
            padding-top: 60px;
        }

        .menu-intro-wrapper {
            text-align: center;
            margin-bottom: 40px;
        }

        .menu-intro {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-dark);
            background: linear-gradient(
                135deg,
                #FFE4C4,
                #FFDAB9
            );
            padding: 18px 30px;
            border-radius: 50px;
            display: inline-block;
            box-shadow: var(--shadow);
        }

        .brownie-list {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 900px;
            margin: auto;
        }

        .brownie-item {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 3px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }

        .brownie-item:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .brownie-item.active {
            border-color: var(--pink);
            background: linear-gradient(
                145deg,
                #FFF8F0,
                #FFEFD5
            );
        }

        .brownie-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brownie-name span.tamil {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 600;
        }

        .size-options {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px dashed #E0C9A6;
        }

        .brownie-item.active .size-options {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .size-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 15px;
            align-items: center;
            background: rgba(255,255,255,0.7);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            border: 2px solid #F5E6D3;
            transition: all 0.3s;
        }

        .size-row:hover {
            border-color: var(--accent);
            background: white;
        }

        .size-info h4 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .size-info p {
            font-size: 0.95rem;
            color: #6D4C41;
        }

        .size-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
        }

        .order-btn {
            background: linear-gradient(
                135deg,
                #25D366,
                #128C7E
            );
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .order-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* ================= MODAL ================= */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 24, 16, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 24px;
            padding: 35px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            animation: popIn 0.35s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--primary-dark);
            margin-bottom: 8px;
            text-align: center;
        }

        .selected-info {
            text-align: center;
            background: #FFF5EE;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 1.05rem;
            color: var(--accent);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .modal label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #5D4037;
        }

        .modal input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E0C9A6;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .modal input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #666;
        }

        .btn-send {
            background: linear-gradient(
                135deg,
                #25D366,
                #128C7E
            );
            color: white;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* ================= CONTACT ================= */

        .contact {
            background: white;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 30px;
        }

        .contact-card {
            background: linear-gradient(
                145deg,
                #FFF8F0,
                #FFEFD5
            );
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-5px);
        }

        .contact-icon {
            font-size: 2.8rem;
            margin-bottom: 16px;
        }

        .contact-card h3 {
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .contact-card p {
            color: #5D4037;
            font-size: 1.05rem;
        }

        .contact-card a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* ================= FOOTER ================= */

        footer {
            background: var(--dark);
            color: #FFE4C4;
            text-align: center;
            padding: 30px 20px;
            font-size: 0.95rem;
        }

        footer strong {
            color: var(--gold);
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .nav-container {
                justify-content: center;
            }

            .nav-links {
                display: none;
            }

            .about-grid {
                grid-template-columns: 1fr;
            }

            .about-image img {
                height: 300px;
            }

            .size-row {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .size-price {
                margin: 5px 0;
            }

            .order-btn {
                width: 100%;
            }

            .brownie-name {
                font-size: 1.5rem;
            }

            .menu-intro {
                font-size: 1.1rem;
            }

            .modal {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">
        <div class="nav-container">

            <a
